name: Deploy entratta.com.br

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy via Coolify
        run: |
          curl -fsSL -X GET \
            "https://coolify.entratta.com.br/api/v1/deploy?uuid=focseagmdyc05gq0d77f2su3&force=false" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}" \
            -H "Accept: application/json"
