name: Deploy entratta.com.br

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            cd /opt/entratta-site/nextapp
            git pull origin main
            docker compose -f /opt/entratta-site/nextapp/docker-compose.yml build --no-cache
            docker compose -f /opt/entratta-site/nextapp/docker-compose.yml up -d --force-recreate
            echo "Deploy finalizado: $(date)"
